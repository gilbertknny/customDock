<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FrostShell — live preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111 url("../assets/demo-wallpaper.jpg") center / cover no-repeat;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      iframe {
        position: absolute;
        border: 0;
        background: transparent;
      }
      #bar {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #bar button {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font: 600 12px inherit;
        backdrop-filter: blur(10px);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button data-a="expand">Expand notch</button>
      <button data-a="collapse">Collapse notch</button>
      <button data-a="notify">New notification</button>
      <button data-a="vol">Volume key</button>
      <button data-a="bri">Brightness key</button>
      <button data-a="charge">Charging activity</button>
      <button data-a="theme">Toggle light/dark</button>
      <button data-a="black">Toggle black notch</button>
    </div>
    <script>
      const p = new URLSearchParams(location.search);
      let theme = p.get('theme') || 'dark';
      let style = p.get('style') || 'glass';
      let ni = 0;
      let vol = 0.4;
      let bri = 0.5;
      function sample() {
        const s = [
          { app: 'Messages', title: 'Kevin', body: 'Bro, push repo-nya udah? Mau gue test di laptop kantor 🙏' },
          { app: 'Calendar', title: 'Stand-up in 5 min', body: 'Daily sync · Google Meet' },
          { app: 'Mail', title: 'GitHub', body: '[customDock] Build succeeded for v0.2.0' },
        ][ni++ % 3];
        return { id: 'p' + Date.now(), appName: s.app, time: Date.now(), ...s };
      }
      function mount() {
        document.querySelectorAll('iframe').forEach((f) => f.remove());
        const W = innerWidth, H = innerHeight;
        const common = `sw=${W}&sh=${H}&theme=${theme}&style=${style}&wallpaper=../../../assets/demo-wallpaper.jpg`;
        const island = document.createElement('iframe');
        Object.assign(island.style, { left: `${(W - 640) / 2}px`, top: '0px', width: '640px', height: '560px' });
        island.src = `../src/renderer/notch/index.html?${common}&x=${(W - 640) / 2}&y=0`;
        island.id = 'island';
        const dock = document.createElement('iframe');
        Object.assign(dock.style, { left: '0px', top: `${H - 383}px`, width: `${W}px`, height: '383px' });
        dock.src = `../src/renderer/dock/index.html?${common}&x=0&y=${H - 383}`;
        dock.id = 'dock';
        document.body.append(island, dock);
        island.onload = () => {
          const s = p.get('state');
          const api = () => island.contentWindow.__notch;
          const wait = (fn) => (api() ? fn(api()) : setTimeout(() => wait(fn), 50));
          if (s === 'expanded') wait((a) => a.setHover(true));
          if (s === 'notifs') wait((a) => (a.setHover(true), a.selectTab('notifs')));
          if (s === 'controls') wait((a) => (a.setHover(true), a.selectTab('controls')));
          if (s === 'bt') wait((a) => (a.setHover(true), a.selectTab('controls'), setTimeout(() => a.openBt(), 400)));
          if (s === 'wifi') wait((a) => (a.setHover(true), a.selectTab('controls'), setTimeout(() => a.openWifi(), 400)));
          if (s === 'toast') wait((a) => a.notify(sample()));
          if (s === 'osd') wait((a) => { a.osd({ kind: 'volume', value: 0.64, muted: false }); setInterval(() => a.osd({ kind: 'volume', value: 0.64, muted: false }), 1200); });
          if (s === 'osd-bri') wait((a) => { a.osd({ kind: 'brightness', value: 0.8 }); setInterval(() => a.osd({ kind: 'brightness', value: 0.8 }), 1200); });
          if (s === 'activity') wait((a) => a.showActivity({ icon: 'bolt', color: '#4ade80', sub: 'Power connected', title: 'Charging', right: '76%' }, 1e9));
        };
      }
      document.getElementById('bar').addEventListener('click', (e) => {
        const a = e.target.dataset.a;
        const api = document.getElementById('island').contentWindow.__notch;
        if (a === 'expand') api.setHover(true);
        if (a === 'collapse') api.setHover(false);
        if (a === 'notify') api.notify(sample());
        if (a === 'vol') api.osd({ kind: 'volume', value: (vol = (vol + 0.1) % 1.05), muted: false });
        if (a === 'bri') api.osd({ kind: 'brightness', value: (bri = (bri + 0.15) % 1.05) });
        if (a === 'charge') api.showActivity({ icon: 'bolt', color: '#4ade80', sub: 'Power connected', title: 'Charging', right: '76%', pulse: true });
        if (a === 'theme') (theme = theme === 'dark' ? 'light' : 'dark'), mount();
        if (a === 'black') (style = style === 'black' ? 'glass' : 'black'), mount();
      });
      if (p.has('clean')) document.getElementById('bar').remove();
      mount();
    </script>
  </body>
</html>

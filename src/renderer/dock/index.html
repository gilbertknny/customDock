<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: frost: file:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>FrostShell Dock</title>
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="dock.css" />
  </head>
  <body class="theme-dark">
    <div id="hot"></div>
    <div id="dock-wrap" data-hit>
      <div id="dock-bg" class="glass"></div>
      <div id="items"></div>
    </div>
    <div id="tip"></div>
    <div id="preview" class="glass" data-hit></div>

    <script src="../shared/mock.js"></script>
    <script src="../shared/icons.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="dock.js"></script>
  </body>
</html>
